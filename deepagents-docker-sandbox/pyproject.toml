[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-docker-sandbox"
version = "0.1.0"
description = "Docker sandbox backend for deepagents - run AI agent code in isolated containers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "zhengjie" },
]
keywords = ["deepagents", "docker", "sandbox", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "deepagents>=0.5.3",
    "docker>=7.0",
]

[project.urls]
Homepage = "https://github.com/zhengjie9510/deepagents-docker-sandbox"
Repository = "https://github.com/zhengjie9510/deepagents-docker-sandbox"
Issues = "https://github.com/zhengjie9510/deepagents-docker-sandbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_docker_sandbox"]
